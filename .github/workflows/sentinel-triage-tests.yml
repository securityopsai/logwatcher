name: sentinel-triage tests

on:
  push:
    paths:
      - 'sentinel_triage/**'
      - '.github/workflows/sentinel-triage-tests.yml'
  pull_request:
    paths:
      - 'sentinel_triage/**'
      - '.github/workflows/sentinel-triage-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Function App runs; 3.12 guards against surprises
        # when Azure moves the default forward.
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: sentinel_triage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest

      - name: Run tests
        run: pytest

      - name: Validate the shipped config
        run: python -m triage.cli validate -c config/triage.yaml
        env:
          PYTHONPATH: app

      - name: Replay the fixture end to end
        run: |
          python -m triage.cli replay -c config/triage.yaml \
            tests/fixtures/incident-noisy-scanner.json \
            --enrichment tests/fixtures/enrichment-noisy-scanner.json \
            --show-comment
        env:
          PYTHONPATH: app

  bicep:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel_triage
    steps:
      - uses: actions/checkout@v4

      - name: Compile the Bicep templates
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          echo "main.bicep and its modules compiled cleanly"
